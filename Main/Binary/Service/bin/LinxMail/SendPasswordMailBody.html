<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Geração automática de senha</title>
    <style type="text/css">
        body
        {
            font-family: "Segoe UI";
            font-size: 12px;
        }
        .Title
        {
            font-weight: bold;
            font-size: 16px;
        }
        .Status
        {
            color: #0000FF;
            font-weight: bold;
            font-size: 14px;
        }
        .Subtitle
        {
            font-size: 14px;
        }
        .ErrorRow
        {
            font-size: 10px;
        }
        .ErrorTable
        {
            border: 1px solid #000000;
        }
        .ErrorTitle
        {
            background-color: #CCCCCC;
        }
        .ErrorEven
        {
            background-color: #FFFF99;
        }
        .ErrorOdd
        {
            background-color: #FFFFCC;
        }
        </style>
</head>
<body>
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr height="30">
            <td>
                &nbsp;
            </td>
            <td>
                &nbsp;
            </td>
        </tr>
        <tr>
            <td align="center" colspan="2" class="Title">
                Geração automática de senha
            </td>
        </tr>
        <tr height="30">
            <td align="center" colspan="2">
                &nbsp;
            </td>
        </tr>
        <tr height="60">
            <td align="center" colspan="2" class="Title">
                Você recebeu o usuário e senha temporários de acesso.
                <br />
                Será necessária a alteração desta senha, não divulgue-a ela é sua segurança.
            </td>
        </tr>
        <tr>
            <td align="center">
                Nome
            </td>
            <td class="Status" width="Auto">
                {0}
            </td>
        </tr>
        <tr>
            <td align="center">
                Login
            </td>
            <td width="Auto" class="Status">
                {1}
            </td>
        </tr>
        <tr>
            <td align="center">
                Senha
            </td>
            <td width="Auto" class="Status">
                {2}
            </td>
        </tr>
        <tr height="20">
            <td align="center" colspan="2">
                &nbsp;
            </td>
        </tr>
        <tr>
            <td align="center" colspan="2" class="Title">
                &nbsp;</td>
        </tr>
        <tr>
        <td align="justify" colspan="3" class="Subtitle" height="80">

        </td>
        </tr>
    </table>
</body>
</html>
