<h3 class="preenchimento-lateral">Injeções de dependência</h3>

<div class="row">
  <div class="form-group col-lg-12 col-sm-12">
    <p class="preenchimento-lateral">Nome</p>

    <div class="col-lg-6">
    	<input class="form-control" ng-model="vm.varName" type="text"/>
    </div>

    <div class="col-lg-6">
    	<button class="btn btn-info" ng-click="vm.addInjection();" ng-disabled="vm.varName.trim() == null || vm.varName.trim().length < 1">Adicionar</button>
    </div>
  </div>
</div>

<div class="row" ng-repeat="variable in vm.injectionList">
  <div class="form-group col-lg-12 col-sm-12">
		<div class="col-lg-6">
			<input class="form-control" disabled type="text" value="{{variable}}">
		</div>
		
		<div class="col-lg-6">
			<button class="btn btn-danger" ng-click="vm.deleteInjection($index);">Remover</button>
		</div> 
  </div>
</div>
