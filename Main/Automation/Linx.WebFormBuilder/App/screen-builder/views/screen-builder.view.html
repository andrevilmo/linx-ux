<div data-ng-controller="formBuilder as vm">
    <!--Componentes-->
    <div class="minimized-tab left" ng-hide="!vm.toggleComponents">
        <button class="btn btn-info btn-xs" ng-click="vm.toggle('components')"><i class="fa fa-chevron-circle-right"></i></button>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-12 col-xs-12 rplr" collapse-width="vm.toggleComponents" lx-list-components flag-toggle="vm.toggleComponents" list-components="vm.listComponents"></div>

    <!--Tela-->
    <div ng-class="vm.classe" class="col-sm-12 col-xs-12"  >
        <lx-screen-builder components="vm.activeComponents" list-components="vm.listComponents"></lx-screen-builder>
        <toaster-container></toaster-container>
    </div>

    <div class="col-lg-3 col-md-3 col-sm-12 col-xs-12 rplr" collapse-width="vm.toggleOdata">

        <div id="oData-content">
            <button class="btn btn-clean btn-xs pull-right" ng-click="vm.toggle('odata')"><i class="fa fa-thumb-tack"></i></button>

            <tabset>
                <!-- Solution Explorer -->
                <tab heading="Explorer">
                    <lx-solution-explorer></lx-solution-explorer>
                </tab>

                <!--oData-->
                <tab heading="oData">
                    <lx-list-odata components="$parent.$parent.vm.activeComponents"></lx-list-odata>
                </tab>

                <!-- Propriedades -->
                <tab heading="Propriedades">
                    <lx-component-properties components="$parent.$parent.vm.activeComponents" list-components="$parent.$parent.vm.listComponents" form-properties="$parent.$parent.vm.formProperties"></lx-component-properties>
                </tab>
            </tabset>
        </div>
    </div>

    <div class="minimized-tab right" ng-hide="!vm.toggleOdata">
        <button class="btn btn-info btn-xs pull-right" ng-click="vm.toggle('odata')">
            <i class="fa fa-chevron-circle-left"></i>
        </button>
    </div>
</div>
