<div class="modal-header">
    <h3 class="text-center">{{component.options.label}}</h3>
</div>
<div class="modal-body">
      <div>
        <span> Nome arquivo: {{component.options.odataEntity}}.</span>
        <input type="text" required="required" ng-model="component.options.fileName" />.xml
      </div>
      <lx-flexmonster sourcePath='libs/bower/flexmonster/' data='component.options.model' options='component.options' containerId='container-layout' />
</div>
<div class="modal-footer">
    <button class="btn btn-success pull-rigth" ng-click="ok()"><i class="fa fa-check"></i> Salvar</button>
    <button class="btn btn-clean pull-left" ng-click="cancel()"><i class="fa fa-times"></i> Cancelar</button>
</div>
