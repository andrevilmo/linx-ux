<div class="modal-header">
    <h3 class="text-center">{{component.options.label}}</h3>
</div>
<div class="modal-body">
    
    <div class="row">
        <div class="col-sm-12 col-lg-12">
            <section>
                <div ui-ace="aceOption" ng-model="aceModel"></div>
                <select ng-model="mode" ng-options="m for m in modes" ng-change="modeChanged()"></select>
            </section>
        </div>

    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-success pull-rigth" ng-click="ok()"><i class="fa fa-check"></i> Salvar</button>
    <button class="btn btn-clean pull-left" ng-click="cancel()"><i class="fa fa-times"></i> Cancelar</button>
</div>
