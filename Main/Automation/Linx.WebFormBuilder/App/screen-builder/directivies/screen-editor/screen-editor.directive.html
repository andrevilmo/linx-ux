<div id="design-content">
    <div class="webform-header">
        <div class="col-lg-6 col-md-6 col-xs-12 col-sm-12">
            <span class="title-grid">{{ vm.fileName }}</span>
        </div>
        
        <div class="col-lg-6 col-md-6 col-xs-12 col-sm-12">  

            <button class="pull-right btn btn-clean" ng-click='vm.FormProperties()'>
                <i class="fa fa-cog"></i>
            </button>  

            <select class="selectpicker pull-right" data-width="auto" selectpicker>
                <option data-icon="fa fa-desktop" value="1"> Web</option>
                <option class="icon-size" data-icon="fa fa-mobile" value="2" selected="selected"> Mobile</option> 
            </select>

        </div>
    </div>

    <div class="row area-drop-down" data-drop="true" ng-model='vm.droppableList' jqyoui-droppable="{multiple:true}"  gridster="vm.gridsterOpts">

        <div class="col-lg-12 col-md-6 col-xs-12 col-sm-12">       

            <ul class="ul-gridster">
                <li gridster-item="item" ng-repeat="item in vm.components track by item.id">
                    <dt-component options='item.options' ng-click='vm.OpenProperties(item)'></dt-component>
                </li>
            </ul>

        </div>
    </div>
</div>
