<div class="modal-header">
    <h3 class="modal-title">Criar nova view</h3>
</div>

<div class="modal-body">

    <form class="form-horizontal">

      <div class="form-group">
        <label class="col-sm-2 control-label">Nome da Tela:*</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.screenName">
        </div>
      </div>

      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <div class="checkbox">
            <label>
              <input type="checkbox" ng-model="vm.generateController"> Gerar controller
            </label>
          </div>
        </div>
      </div>
      

      <div class="form-group" ng-show="vm.generateController">
        <label class="col-sm-2 control-label">Nome da Controller:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.controllerName">
        </div>
      </div>

      <div class="form-group" ng-show="vm.generateController">
        <label class="col-sm-2 control-label">URL da rota:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.controllerRoute">
        </div> 
      </div>

    </form>

</div>

<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="vm.create()" ng-disabled="(!vm.screenName || vm.screenName.trim().length < 3) || (vm.generateController &&  ((!vm.controllerName || vm.controllerName.length < 3) || (!vm.controllerRoute || vm.controllerRoute.length < 3)))">Criar</button>
    <button class="btn btn-warning" type="button" ng-click="vm.cancel()">Cancelar</button>
</div>
