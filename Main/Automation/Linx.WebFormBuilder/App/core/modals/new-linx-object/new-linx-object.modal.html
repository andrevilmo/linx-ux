<div class="modal-header">
    <h3 class="modal-title">Criar novo objeto Linx</h3>
</div>

<div class="modal-body">

    <form class="form-horizontal">
      <div class="form-group">
        <label class="col-sm-2 control-label">URL das entidades:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.urlEntities">
          
          
          
      <div ng-show="vm.Urls.length > 0 && (vm.entities.length == 0 || !vm.urlEntities) ">
      <span></span>
        <ul class="list-group">
          <li style="cursor:pointer" class="list-group-item" ng-repeat="url in vm.Urls" ng-click="vm.selectUrl(url)">
              {{ url.url }}
              <span class="glyphicon glyphicon-ok form-control-feedback pull-right hidden-xs hidden-sm" aria-hidden="true" ng-show="url.selected && vm.urlEntities"></span>
          </li>
        </ul>

      </div>
        
          
        </div>
      </div>

      <div ng-show="vm.entities.length > 0 && vm.urlEntities">
        <ul class="list-group">
          <li style="cursor:pointer" class="list-group-item" ng-repeat="entity in vm.entities" ng-click="vm.select(entity)">
              {{ entity.Name }}
              <span ng-show="entity.atualizar"> - (Atualizar)</span>
              <span class="glyphicon glyphicon-ok form-control-feedback pull-right hidden-xs hidden-sm" aria-hidden="true" ng-show="entity.atualizar || entity.selected"></span>
          </li>
        </ul>

        <button class="btn btn-primary pull-right" type="button" ng-click="vm.generate()">Gerar</button>
      </div>

      <div class="clearfix"></div>
    </form>

</div>

<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="vm.serchEntities()" ng-disabled="vm.urlEntities == null || vm.urlEntities.trim().length < 3">Pesquisar</button>
    <button class="btn btn-warning" type="button" ng-click="vm.cancel()">Cancelar</button>
</div>
