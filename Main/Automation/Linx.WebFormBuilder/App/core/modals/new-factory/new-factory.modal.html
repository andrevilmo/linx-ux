<div class="modal-header">
    <h3 class="modal-title">Criar nova factory</h3>
</div>

<div class="modal-body">

    <form class="form-horizontal">

        <div class="form-group">
            <label class="col-sm-2 control-label">Nome da Factory:*</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" ng-model="vm.factoryName">
            </div>
        </div>

        
    </form>

</div>

<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="vm.create()" ng-disabled="!vm.factoryName || vm.factoryName.trim().length < 3">Criar</button>
    <button class="btn btn-warning" type="button" ng-click="vm.cancel()">Cancelar</button>
</div>
