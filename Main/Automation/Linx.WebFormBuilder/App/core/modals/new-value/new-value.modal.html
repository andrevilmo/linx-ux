<div class="modal-header">
    <h3 class="modal-title">Criar novo value</h3>
</div>

<div class="modal-body">

    <form class="form-horizontal">

      <div class="form-group">
        <label class="col-sm-2 control-label">Nome do Value:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.valueName">
        </div>
      </div>

      <div class="form-group">
        <label class="col-sm-2 control-label">Valor:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.valueValue">
        </div>
      </div>
    </form>

</div>

<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="vm.create()" ng-disabled="vm.valueName == null || vm.valueValue == null || vm.valueName.trim().length < 3 || vm.valueValue.trim().length < 1">Criar</button>
    <button class="btn btn-warning" type="button" ng-click="vm.cancel()">Cancelar</button>
</div>
