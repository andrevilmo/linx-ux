<div class="modal-header">
    <h3 class="modal-title">Criar nova constant</h3>
</div>

<div class="modal-body">

    <form class="form-horizontal">

      <div class="form-group">
        <label class="col-sm-2 control-label">Nome da Constant:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.constantName">
        </div>
      </div>

      <div class="form-group">
        <label class="col-sm-2 control-label">Valor:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" ng-model="vm.constantValue">
        </div>
      </div>

    </form>

</div>

<div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="vm.create()" ng-disabled="vm.constantValue == null || vm.constantName == null || vm.constantName.trim().length < 3 || vm.constantValue.trim().length < 1">Criar</button>
    <button class="btn btn-warning" type="button" ng-click="vm.cancel()">Cancelar</button>
</div>
