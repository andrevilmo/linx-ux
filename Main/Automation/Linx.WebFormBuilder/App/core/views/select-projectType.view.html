<div ng-controller="ProjectTypeController as vm" class="container paineis-project-type">
  <h1>Escolha a opção de projeto que deseja criar</h1>

  <div class="loaderWrap" ng-show="vm.loader">
    <div class="spinner-loader" ng-show="vm.loader"></div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="painel col-xs-12 col-sm-5 col-md-5" ng-click="vm.openNewProject();">
        <div class="header">
          <i class="fa fa-certificate fa-2x"></i>
          <h3>Novo Projeto</h3>

          <p>Criar um novo projeto</p>
        </div>

        <div class="footer">
          <button class="btn btn-success">Criar</button>
        </div>
      </div>

      <div class="painel col-xs-12 col-sm-5 col-md-5" ng-click="vm.downloadGitProject();">
        <div class="header">
          <i class="fa fa-github fa-2x"></i>
          <i class="fa fa-bitbucket-square fa-2x"></i>
          <h3>Projeto Existente</h3>

          <p>Download de um projeto existente</p>
        </div>

        <div class="footer">
          <button class="btn btn-success">Download</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card-navigation">
    <a class="" ng-click="vm.welcome()">VOLTAR</a>
  </div>
</div>
