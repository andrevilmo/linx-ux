<div class="form-group">
  {{#if options.ngIf}}
  <label {{#each custom}} {{property}}="{{value}}" {{/each}} class="{{options.class}}" for="{{options.odata.Name}}" ng-show="{{options.visible}}" ng-if="{{options.ngIf}}">
    {{options.label}}
  </label>
  {{else}}
  <label {{#each custom}} {{property}}="{{value}}" {{/each}} class="{{options.class}}" for="{{options.odata.Name}}" ng-show="{{options.visible}}">
    {{options.label}}
  </label>
  {{/if}}
</div>
