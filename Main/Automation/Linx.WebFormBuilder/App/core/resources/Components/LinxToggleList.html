<ion-list can-swipe="true">
    <ion-item {{#each custom}} {{property}}="{{value}}" {{/each}} ng-repeat="item in vm.dataBusiness.currentDataItem().{{options.repeater}}List">
        <p ng-bind="item.{{ options.headerPropertie }}"></p>
        <ion-toggle ng-repeat="item in vm.dataBusiness.currentDataItem().{{options.repeater}}List"
                    ng-model="item.checked"
                    ng-checked="item.checked">
        </ion-toggle>
</ion-list>
