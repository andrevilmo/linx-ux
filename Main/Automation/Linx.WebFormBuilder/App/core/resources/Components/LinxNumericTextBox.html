{{#if options.odata}}
<label class="{{options.class}}">
  <input {{#each custom}} {{property}}="{{value}}" {{/each}} type="number" placeholder="{{options.label}}" ng-model="vm.dataBusiness.currentDataItem().{{options.odata.Name}}" ng-show="{{options.visible}}" ng-change="{{options.ngChange}}">
</label>
{{else}}
<label class="{{options.class}}">
  <input {{#each custom}} {{property}}="{{value}}" {{/each}} type="number" placeholder="{{options.label}}" ng-model="{{options.model}}" ng-show="{{options.visible}}" ng-change="{{options.ngChange}}">
</label>
{{/if}}
