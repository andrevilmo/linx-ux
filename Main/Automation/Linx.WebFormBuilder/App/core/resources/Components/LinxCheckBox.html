{{#if options.odata}}
<ion-checkbox {{#each custom}} {{property}}="{{value}}" {{/each}} ng-model="vm.dataBusiness.currentDataItem().{{options.odata.Name}}">{{options.label}}</ion-checkbox>
{{else}}
<ion-checkbox {{#each custom}} {{property}}="{{value}}" {{/each}} ng-model="{{options.model}}">{{options.label}}</ion-checkbox>
{{/if}}
