<div data-ng-controller="PreviewController as vm">
    <div class="col-lg-9 col-md-9 col-sm-12 col-xs-12">
        <div id="design-content">
            <div class="webform-header" style="z-index:0;">
                <div class="col-lg-6 col-md-6 col-xs-12 col-sm-12">
                    <span class="title-grid">{{vm.title}}</span>
                </div>
            </div>

            <div class="row area-drop-down">
                <div class="col-lg-12 col-md-12">
                    <div class="embed-responsive embed-responsive-4by3">
                        <iframe style="height:580px;width:400px;margin-left:auto;" class="embed-responsive-item" ng-src="{{ vm.urlPreview }}"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-md-3 col-sm-12 col-xs-12 rplr">

        <div id="oData-content">

            <tabset>

                <!-- Solution Explorer -->
                <tab heading="Explorer">
                    <lx-solution-explorer></lx-solution-explorer>
                    <toaster-container></toaster-container>
                </tab>
            </tabset>

        </div>

    </div>
</div>
