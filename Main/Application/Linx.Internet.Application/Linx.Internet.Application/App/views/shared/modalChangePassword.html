<div class="modal-dialog-small">
    <div class="modal-content">
        <div class="modal-header">
            <!-- ko if: canClose() -->
            <button type="button" data-bind="click: cancel" class="close" data-dismiss="modal" aria-hidden="true"></button>
            <!--/ko-->
            <h4 class="modal-title">Alteração de senha</h4>
        </div>
        <div class="modal-body">
            <form id="formPassword" class="change-password">
                <div class="form-group">
                    <label for="senhaAtual" class="control-label">
                        Senha atual
                            <span id="span_senhaAtual" class="required" aria-required="true">*</span>
                    </label>
                    <div class="">
                        <div class="input-icon right">
                            <i class="fa"></i>
                            <input class="form-control input-large" type="password" id="senhaAtual" name="senhaAtual" />
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="novaSenha" class="control-label">
                        Nova senha
                            <span id="span_novaSenha" class="required" aria-required="true">*</span>
                    </label>
                    <div class="">
                        <div class="input-icon right">
                            <i class="fa"></i>
                            <input class="form-control input-large" type="password" id="novaSenha" name="novaSenha" />
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmacao" class="control-label">
                        Confirmação
                            <span id="span_confirmacao" class="required" aria-required="true">*</span>
                    </label>
                    <div class="">
                        <div class="input-icon right">
                            <i class="fa"></i>
                            <input class="form-control input-large" type="password" id="confirmacao" name="confirmacao" />
                        </div>
                    </div>
                </div>

            </form>
            <!-- ko if: mustReturnToLogin() -->
            <p class="help-block" style="margin-top: 12px;">
                Se fechar esta janela, o login deverá ser feito novamente.
            </p>
            <!--/ko-->
        </div>
        <div class="modal-footer">
            <button class="btn btn-ok" id="btnOk" data-bind="click: ok">Ok</button>
            <!-- ko if: canClose() -->
            <button class="btn btn-close" id="btnCancel" data-bind="click: cancel">Cancelar</button>
            <!--/ko-->
            <!-- ko if: mustReturnToLogin() -->
            <button class="btn btn-close" id="btnVoltarAoLogin" data-bind="click: voltarAoLogin">voltar ao login</button>
            <!--/ko-->
        </div>
    </div>
</div>
