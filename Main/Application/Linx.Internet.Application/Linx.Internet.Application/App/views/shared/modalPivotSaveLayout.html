<div class="modal-dialog modal-dialog-small">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" data-bind="click: cancel" class="close" data-dismiss="modal" aria-hidden="true"></button>
            <h4 class="modal-title">Salvar Layout</h4>
        </div>
        <div class="modal-body ">
            <div class="form-group">
                <label for="tbLayoutName" class="control-label ellipsis">Nome do Layout</label>
                <div class="controls">
                    <input id="tbLayoutName" class="form-control ellipsis input-medium IsEditableStyle" data-bind="enable: $root.canEditNomeLayout, value: nomeLayout" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="cboDestino" class="control-label ellipsis">Destino</label>
                        <div class="controls">
                            <select name="cboDestino" class="form-control select2-hidden-accessible" data-bind="value: selectedLocal, event: { change: onChangeSelectLocal }, enable: $root.canEditNomeLayout" style="border: 1px solid #ccc !important;">
                                <option value="local">local</option>
                                <option value="server" selected>Servidor</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div id="divPermissions" class="col-md-12">
                    <p class="control-label ellipsis" style="margin-bottom: 10px !important;font-weight: 600;">Permissões:</p>

                    <div class="form-group ui-select-multi">
                        <label for="cboUsuarios" class="control-label ellipsis">Usuários</label>
                        <div class="controls">
                            <span id="cboUsuarios" multiple="multiple" class="form-control select2-hidden-accessible"></span>
                        </div>
                    </div>

                    <div class="form-group ui-select-multi">
                        <label for="cboPerfis" class="control-label ellipsis">Perfis</label>
                        <div class="controls">
                            <span id="cboPerfis" multiple="multiple" class="form-control select2-hidden-accessible"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ok" id="btnSave" data-bind="click: save">Salvar</button>
            <button class="btn btn-close" id="btnCancel" data-bind="click: cancel">Cancelar</button>
        </div>
    </div>
</div>
