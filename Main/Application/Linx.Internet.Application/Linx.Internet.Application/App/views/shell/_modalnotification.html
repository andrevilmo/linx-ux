<style>
    .modal-dialog img {
        max-width: 100%;
    }
</style>

<div class="modal-dialog modal-dialog-default mx-3">
    <div class="modal-content">
        <div class="modal-header">
            <!-- ko if: canClose() -->
            <button type="button" data-bind="click: cancel" class="close" data-dismiss="modal" aria-hidden="true"></button>
            <!--/ko-->
            <h4 class="modal-title" data-bind="text : message.titulo"></h4>
        </div>
        <div class="modal-body" style="overflow-y: auto;">
            <div id="divContent">
                <!-- ko if: openExternalUI() -->
                <iframe id="externalFrame" src="" frameborder="0" width="100%" height="400"></iframe>
                <!--/ko-->
            </div>
        </div>
        <div class="modal-footer">
            <!-- ko if: canClose() -->
            <button class="btn btn-ok" id="btnOk" data-bind="click: ok">Ok</button>
            <!--/ko-->
        </div>
    </div>
</div>
