<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <!--

        For details, see http://go.microsoft.com/fwlink/?LinkID=617521

    <title>BlankCordovaApp2</title>

    <!-- BlankCordovaApp2 references -->
    <link href="css/index.css" rel="stylesheet" />
</head>
<body>
    <p>
        TesteScanner
    </p>
    <button onclick="myFunctionScan()">scan</button><BR><BR><BR>
    <!--<button onclick="myFunctionEncode()">encode</button>-->

    <!-- Cordova reference, this is added to your app when it's built. -->
    <script src="cordova.js"></script>
    <script src="scripts/platformOverrides.js"></script>

    <script src="scripts/index.js"></script>
    <script>

        function myFunctionScan() {
            cordova.plugins.barcodeScanner.scan(
               function (result) {
                   var divConsole = document.getElementById('divConsole');
                   var message = (
                         "Result: " + result.text + "\n" + result.format);

                   divConsole.innerText += message + '\r\n------------------\r\n';
               },
               function (error) {
                   alert("Scanning failed: " + error);
               }
            );
        }

        function myFunctionEncode() {
            cordova.plugins.barcodeScanner.encode(cordova.plugins.barcodeScanner.Encode.TEXT_TYPE, "http://www.nytimes.com", function (success) {
					alert("encode success: " + success);
				}, function (fail) {
					alert("encoding failed: " + fail);
				}
			);
        }
    </script>

    <div id="divConsole"></div>
</body>
</html>
