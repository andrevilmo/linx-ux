name: Compile

on:
  push:
    branches:
      - master
      - cursor/**
  pull_request:
  workflow_dispatch:

jobs:
  build-framework:
    name: Build .NET Framework solutions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linx.Framework.BV
            solution: Main/User Interface/Linx.Framework.BV/Linx.Framework.BV.sln
          - name: Linx.Framework.BV.WebAPI.DS
            solution: Main/Business/Linx.Framework.BV/Linx.Framework.BV.WebAPI.DS/Linx.Framework.BV.WebAPI.DS.csproj
          - name: Linx.Internet.Application
            solution: Main/Application/Linx.Internet.Application/Linx.Internet.Application.sln
          - name: Linx.Portal
            solution: Main/Application/Linx.Portal/Linx.Portal.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: NuGet restore
        run: nuget restore "${{ matrix.solution }}" -NonInteractive
        continue-on-error: true

      - name: MSBuild ${{ matrix.name }}
        run: msbuild "${{ matrix.solution }}" /p:Configuration=Release /m /v:minimal /nologo

  build-core:
    name: Build .NET Core projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            2.1.x
            8.0.x

      - name: Build Core libraries
        run: |
          set -e
          projects=(
            "Main/Data/Linx.Data.Core/Linx.Data.Core.csproj"
            "Main/Common/Linx.Tools.Library/Desktop/Linx.Tools.Core/Linx.Tools.Core.csproj"
            "Main/Common/Linx.LinqExtensions.Library/Desktop/Linx.LinqExtensions.Core/Linx.LinqExtensions.Core.csproj"
            "Main/Common/Linx.Security.Core/Linx.Security.Core.csproj"
            "Main/Data/Linx.DataService/Linx.DomainService.Core/Linx.DomainService.Core.csproj"
            "Main/Data/Linx.DataService/Linx.DataService.Core/Linx.DataService.Core.csproj"
            "Main/Business/Linx.License.Client/Linx.License.Client.Core/Linx.License.Client.Core.csproj"
            "Main/Business/Linx.License.Client/Linx.License.Client.WebAPICore/Linx.License.Client.WebAPICore.csproj"
          )
          failed=0
          for p in "${projects[@]}"; do
            echo "::group::Build $p"
            if ! dotnet build "$p" -c Release; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
